    <!-- Sidebar -->

    <!-- Nội dung -->
    <main class="content">
      <h1>Thêm loại Sản Phẩm Mới</h1>

      <section class="form-section" >
        <h2>Thêm loại sản phẩm mới</h2>
        <form id="addCate">
          <label>Tên loại sản phẩm:</label>
          <input type="text" name="tenloaisp" placeholder="VD: SP02">

          <label>Mã sản phẩm:</label>
          <input type="text" name="masp" placeholder="VD: SP02">

          <label>Tên sản phẩm:</label>
          <input type="text" name="tensp" placeholder="VD: Giày cầu lông Yonex 88D">

          <label>Hình sản phẩm:</label>
          <input type="file" name="hinhanh">

          <label>Nhập số thuộc tính sản phẩm:</label>
                <input type="number" id="soThuocTinh" placeholder="VD: 4">

                <button type="button" id="btnTaoThuocTinh">Tạo thuộc tính</button>

                <div id="thuocTinh">

                  
                </div>
          <div class="form-actions">
            <button type="submit" class="btn save-btn">Lưu sản phẩm</button>
            <a href="QuanLySanPham.html" class="cancel-btn">Hủy</a>
          </div>
        </form>
      </section>
    </main>

  <script src="../assets/js/scrip.js"></script>
