<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thêm Sản Phẩm</title>
  <link rel="stylesheet" href="../assets/css/fontinter.css">
  <link rel="stylesheet" href="../assets/css/root.css">
  <link rel="stylesheet" href="../assets/css/QuanLySanPham.css">
</head>
<body>
  <div class="container">
    <!-- Sidebar -->
    <nav class="sidebar">
      <h2 class="logo">Admin</h2>
      <ul class="menu">
        <li><a href="dashboard.html"> Dashboard</a></li>
        <li><a href="QuanLyuser.html"> Quản lý người dùng / Khách hàng</a></li>
        <li><a href="QuanLySanPham.html"
          style="background:#2a2a3b; color:#00bfff; border-left:4px solid #00bfff;"> Quản lý sản phẩm</a></li>
        <li><a href="NhaphangGiaban.html"> Nhập hàng & Giá bán</a></li>
        <li><a href="DonhangTonkho.html"> Đơn hàng & Tồn kho</a></li>
      </ul>
    </nav>

    <!-- Nội dung -->
    <main class="content">
      <h1>Thêm Sản Phẩm Mới</h1>

      <section class="form-section">
        <h2>Thêm sản phẩm mới</h2>
        <form>
          <label>Loại sản phẩm:</label>
          <select>
            <option value="">-- Chọn loại --</option>
            <option value="Vợt">Vợt</option>
            <option value="Giày">Giày</option>
            <option value="Phụ kiện">Phụ kiện</option>
          </select>

          <label>Mã sản phẩm:</label>
          <input type="text" name="masp" placeholder="VD: SP02">

          <label>Tên sản phẩm:</label>
          <input type="text" name="tensp" placeholder="VD: Giày cầu lông Yonex 88D">

          <label>Hình sản phẩm:</label>
          <input type="file" name="hinhanh">

          <label>Màu sắc:</label>
          <input type="text" name="mausac" placeholder="VD: Đen - Vàng">

          <label>Trọng lượng:</label>
          <input type="text" name="trongluong" placeholder="VD: 4UG5">

          <label>Mô tả sản phẩm:</label>
          <textarea name="mota" placeholder="Nhập mô tả chi tiết sản phẩm..."></textarea>

          <div class="form-actions">
            <button type="submit" class="btn save-btn">Lưu sản phẩm</button>
            <a href="QuanLySanPham.html" class="cancel-btn">Hủy</a>
          </div>
        </form>
      </section>
    </main>
  </div>
</body>
</html>
