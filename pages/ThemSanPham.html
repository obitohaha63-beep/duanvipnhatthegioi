    <!-- Nội dung -->
    <main class="content">
      <h1>Tạo loại sản phẩm</h1>

<form id="addCate">

  <!-- ===== THÔNG TIN ===== -->
  <div class="form-section">
    <h2>Thông tin cơ bản</h2>

    <label>Tên loại sản phẩm</label>
    <input type="text" name="name" required placeholder="VD: Vợt cầu lông">

    <label>Mô tả</label>
    <textarea name="description" placeholder="Mô tả ngắn"></textarea>
  </div>

  <!-- ===== ATTRIBUTES ===== -->
  <div class="form-section">
    <h2>Thuộc tính sản phẩm</h2>

    <div id="attributes"></div>

    <button type="button" onclick="addAttribute()" class="add-btn">
      + Thêm thuộc tính
    </button>
  </div>

  <!-- ===== ACTION ===== -->
  <div class="form-actions">
    <button type="button" onclick="window.location.href='../pages/QuanLySanPham.html'">Trở về</button>
    <button type="submit" class="save-btn">Tạo loại</button>
  </div>

</form>
