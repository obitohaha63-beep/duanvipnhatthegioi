<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tạo loại sản phẩm</title>

  <link rel="stylesheet" href="../assets/css/root.css">
  <link rel="stylesheet" href="../assets/css/QuanLySanPham.css">
</head>

<body>
<div class="container">

  <!-- SIDEBAR -->
  <aside class="sidebar">
    <h2 class="logo">Admin</h2>
    <ul>
      <li><a href="dashboard.html">Dashboard</a></li>
      <li><a href="QuanLyuser.html">Users</a></li>
      <li class="active"><a href="QuanLySanPham.html">Products</a></li>
      <li><a href="NhaphangGiaban.html">Import & Pricing</a></li>
      <li><a href="DonhangTonkho.html">Orders & Stock</a></li>
    </ul>
  </aside>

  <!-- MAIN -->
  <main class="main">

    <!-- HEADER -->
    <div class="page-header">
      <h1>Tạo loại sản phẩm</h1>
      <button onclick="history.back()" class="btn-secondary">← Quay lại</button>
    </div>

    <form id="addCate" class="form-card">

      <!-- ===== BASIC INFO ===== -->
      <section class="card">
        <h2>Thông tin cơ bản</h2>

        <div class="form-group">
          <label>Tên loại sản phẩm</label>
          <input type="text" name="name" required placeholder="VD: Vợt cầu lông">
        </div>

        <div class="form-group">
          <label>Mô tả</label>
          <textarea name="description" placeholder="Mô tả ngắn"></textarea>
        </div>
      </section>

      <!-- ===== ATTRIBUTES ===== -->
      <section class="card">
        <div class="card-header-flex">
          <h2>Thuộc tính sản phẩm</h2>
          <button type="button" onclick="addAttribute()" class="btn-primary">
            + Thêm thuộc tính
          </button>
        </div>

        <div id="attributes" class="attribute-list">
          <!-- JS render -->
        </div>
      </section>

      <!-- ===== ACTION ===== -->
      <div class="form-actions">
        <button type="button" onclick="history.back()" class="btn-secondary">
          Hủy
        </button>
        <button type="submit" class="btn-primary">
          + Tạo loại sản phẩm
        </button>
      </div>

    </form>

  </main>
</div>

<script src="../assets/js/scrip.js"></script>
</body>
</html>
