<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chi tiết đơn hàng</title>
  <link rel="stylesheet" href="../assets/css/DonhangTonkho.css">
  <link rel="stylesheet" href="../assets/css/fontinter.css">
  <link rel="stylesheet" href="../assets/css/root.css">
</head>

<body>
<div style="margin:20px;">
  <button onclick="goBack()" class="back-btn">← Quay về danh sách đơn hàng</button>
</div>
<div class="card" style="margin-top:20px;">
  <h3>Chi tiết đơn hàng: <span id="madonhienthi"></span></h3>

  <div class="form-group">
    <label>Khách hàng:</label>
    <input type="text" id="customerName" readonly>

    <label>Ngày đặt:</label>
    <input type="text" id="orderDate" readonly>
  </div>

  <div class="form-group">
    <label>Địa chỉ:</label>
    <input type="text" id="address" readonly>

    <label>Điện thoại:</label>
    <input type="text" id="phone" readonly>
  </div>

  <table>
    <thead>
      <tr>
        <th>Mã SP</th>
        <th>Tên sản phẩm</th>
        <th>Số lượng</th>
        <th>Đơn giá</th>
        <th>Thành tiền</th>
      </tr>
    </thead>
    <tbody id="orderItemsBody"></tbody>
    <tfoot>
      <tr>
        <th colspan="4">Tổng cộng</th>
        <th id="totalAmount"></th>
      </tr>
    </tfoot>
  </table>

  <div class="form-group" style="margin-top:15px;">
    <label>Tình trạng đơn hàng:</label>
    <select id="statusSelect">
      <option value="pending">Chưa xử lý</option>
      <option value="confirmed">Xác nhận</option>
      <option value="delivered">Đã giao thành công</option>
      <option value="cancelled">Hủy đơn hàng</option>
    </select>

    <button id="updateStatusBtn">Cập nhật</button>
  </div>
</div>

<script src="../assets/js/chitietdonhang.js"></script>

</body>
</html>
