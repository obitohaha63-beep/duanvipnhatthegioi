<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">
<title>Thêm sản phẩm</title>

<style>

body{
font-family: Arial;
width:600px;
margin:auto;
}

label{
font-weight:bold;
display:block;
margin-top:10px;
}

input,select,textarea{
width:100%;
padding:8px;
margin-top:4px;
box-sizing:border-box;
}

button{
margin-top:15px;
padding:10px;
background:green;
color:white;
border:none;
cursor:pointer;
}

button:hover{
background:#0a8f0a;
}

</style>

</head>

<body>

<h2>Thêm sản phẩm</h2>

<form id="productForm">

<label>Mã sản phẩm</label>
<input name="product_code" required>

<label>Tên sản phẩm</label>
<input name="name" required>

<label>Loại sản phẩm</label>
<select name="category">
<option value="">--Chọn loại--</option>
<option value="1">Vợt cầu lông</option>
<option value="2">Giày cầu lông</option>
<option value="3">Áo cầu lông</option>
</select>

<label>Màu sắc</label>
<input name="color" placeholder="Ví dụ: Đỏ / Xanh">

<label>Trọng lượng (g)</label>
<input type="number" name="weight" min="0">

<label>Mô tả sản phẩm</label>
<textarea name="description" rows="4"></textarea>

<label>Đơn vị tính</label>
<input name="unit" placeholder="Ví dụ: Cây / Đôi / Cái">

<label>Số lượng tồn ban đầu</label>
<input type="number" name="stock_quantity" min="0">

<label>Giá vốn (VNĐ)</label>
<input type="number" name="cost_price" min="0">

<label>Tỷ lệ lợi nhuận (%)</label>
<input type="number" name="profit_rate" min="0" max="100">

<label>Link hình ảnh</label>
<input type="url" name="image">

<label>Trạng thái</label>
<select name="status">
<option value="1">Hiển thị</option>
<option value="0">Ẩn</option>
</select>

<button type="submit">Thêm sản phẩm</button>

</form>

<script>

document.getElementById("productForm").onsubmit=function(e){

e.preventDefault()

let data = new FormData(this)

fetch("../assets/php/add_product.php",{
method:"POST",
body:data
})
.then(res=>res.text())
.then(data=>alert(data))
.catch(err=>console.log(err))

}

</script>

</body>
</html>
