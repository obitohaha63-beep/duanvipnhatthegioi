<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">
<title>Thêm sản phẩm</title>

<!-- VALIDATION INLINE CSS - Hiển thị cảnh báo lỗi -->
<link rel="stylesheet" href="../assets/css/validation-styles.css">

<style>

body{
font-family: Arial;
width:600px;
margin:auto;
padding: 20px;
}

h2 {
  color: #333;
  margin-bottom: 20px;
}

label{
font-weight:bold;
display:block;
margin-top:10px;
}

input,select,textarea{
width:100%;
padding:8px;
margin-top:4px;
box-sizing:border-box;
border: 1px solid #ddd;
border-radius: 4px;
font-size: 14px;
}

input:focus,
select:focus,
textarea:focus {
  outline: none;
  border-color: #007bff;
}

button{
margin-top:15px;
padding:10px 20px;
background:green;
color:white;
border:none;
cursor:pointer;
border-radius: 4px;
font-weight: bold;
font-size: 14px;
}

button:hover{
background:#0a8f0a;
}

</style>

</head>

<body>

<h2>Thêm sản phẩm</h2>

<form id="productForm">

<label>Mã sản phẩm</label>
<input name="product_code" required>

<label>Tên sản phẩm</label>
<input name="name" required>

<label>Loại sản phẩm</label>
<select name="category">
<option value="">--Chọn loại--</option>
<option value="1">Vợt cầu lông</option>
<option value="2">Giày cầu lông</option>
<option value="3">Áo cầu lông</option>
</select>

<label>Màu sắc</label>
<input name="color" placeholder="Ví dụ: Đỏ / Xanh">

<label>Trọng lượng (g)</label>
<input type="number" name="weight" min="0">

<label>Mô tả sản phẩm</label>
<textarea name="description" rows="4"></textarea>

<label>Đơn vị tính</label>
<input name="unit" placeholder="Ví dụ: Cây / Đôi / Cái">

<label>Số lượng tồn ban đầu</label>
<input type="number" name="stock_quantity" min="0">

<label>Giá vốn (VNĐ)</label>
<input type="number" name="cost_price" min="0">

<label>Tỷ lệ lợi nhuận (%)</label>
<input type="number" name="profit_rate" min="0" max="100">

<label>Link hình ảnh</label>
<input type="url" name="image">

<label>Trạng thái</label>
<select name="status">
<option value="1">Hiển thị</option>
<option value="0">Ẩn</option>
</select>

<button type="submit">Thêm sản phẩm</button>

</form>

<!-- VALIDATION INLINE JS - Hệ thống validate chung (phải load trước) -->
<script src="../assets/js/validation.js"></script>
<!-- ADMIN PRODUCT JS - Xử lý validation cho form thêm sản phẩm -->
<script src="../assets/js/admin-product.js"></script>

</body>
</html>
