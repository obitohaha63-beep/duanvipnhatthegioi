<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">
<title>Thêm sản phẩm</title>

<style>

body{
font-family: Arial;
width:600px;
margin:auto;
}

input,select,textarea{
width:100%;
padding:8px;
margin:5px 0;
}

button{
padding:10px;
background:green;
color:white;
border:none;
}

</style>

</head>

<body>

<h2>Thêm sản phẩm</h2>

<form id="productForm">
    
<input name="product_code" placeholder="Mã sản phẩm" required>

<input name="name" placeholder="Tên sản phẩm" required>

<input name="category" placeholder="Loại">
<input name="color" placeholder="color">
<input name="weight" placeholder="weight">
<textarea name="description" placeholder="Mô tả"></textarea>

<input name="unit" placeholder="Đơn vị tính">

<input type="number" name="stock_quantity" placeholder="Số lượng tồn ban đầu">

<input type="number" name="cost_price" placeholder="Giá vốn">

<input type="number" name="profit_rate" placeholder="Tỷ lệ lợi nhuận (%)">

<input name="image" placeholder="Link hình ảnh">

<select name="status">
<option value="1">Hiển thị</option>
<option value="0">Ẩn</option>
</select>

<button type="submit">Thêm sản phẩm</button>

</form>

<script>

document.getElementById("productForm").onsubmit=function(e){

e.preventDefault()

let data = new FormData(this)

fetch("../assets/php/add_product.php",{
method:"POST",
body:data
})
.then(res=>res.text())
.then(data=>alert(data))

}

</script>

</body>
</html>
