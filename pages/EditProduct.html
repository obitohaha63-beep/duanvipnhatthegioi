<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sửa sản phẩm</title>

  <link rel="stylesheet" href="../assets/css/root.css">
  <link rel="stylesheet" href="../assets/css/QuanLySanPham.css">
  <style>
    .preview-img { max-width: 150px; margin-top: 10px; display: block; }
  </style>
</head>
<body>
<div class="container">

  <!-- SIDEBAR -->
  <nav class="sidebar">
    <h2 class="logo">Admin Panel</h2>
    <ul class="menu">
      <li><a href="dashboard.html">Dashboard</a></li>
      <li><a href="QuanLyuser.html">Quản lý người dùng / Quản trị viên</a></li>
      <li><a href="QuanLySanPham.html" style="background:#2a2a3b; color:#00bfff; border-left:4px solid #00bfff;">Quản lý sản phẩm</a></li>
      <li><a href="NhaphangGiaban.html">Nhập hàng</a></li>
      <li><a href="NhaphangGiaban2.html">Giá bán</a></li>
      <li><a href="DonhangTonkho.html">Đơn hàng & Tồn kho</a></li>
    </ul>
  </nav>

  <!-- CONTENT -->
  <main class="content">

    <div class="page-header">
      <h1>Sửa sản phẩm</h1>
      <button onclick="history.back()" class="btn-secondary">← Quay lại</button>
    </div>

    <form id="editProductForm" class="form-card">

      <input type="hidden" name="id" id="productId">

      <div class="form-group">
        <label>Danh mục</label>
        <select name="category_id" id="categorySelect" required></select>

        <label>Thương hiệu</label>
        <input type="text" name="brand" id="brandInput" required>

        <label>Tên sản phẩm</label>
        <input type="text" name="name" id="nameInput" required>

        <label>Màu sắc</label>
        <input type="text" name="color" id="colorInput">

        <label>Thông số</label>
        <input type="text" name="size" id="sizeInput">

        <label>Giá nhập</label>
        <input type="number" name="cost_price" id="costInput" required>

        <label>% Lợi nhuận</label>
        <input type="number" name="profit_rate" id="profitInput">

        <label>Số lượng</label>
        <input type="number" name="quantity" id="quantityInput">

        <label>Ảnh sản phẩm</label>
        <input type="file" id="imageInput" accept="image/*">
        <img id="previewImage" class="preview-img" src="" alt="Preview">

        <label>Mô tả</label>
        <textarea name="description" id="descriptionInput" rows="5"></textarea>

        <label>Trạng thái</label>
        <select name="status" id="statusSelect">
          <option value="visible">Hiển thị</option>
          <option value="hidden">Ẩn</option>
        </select>
      </div>

      <div class="form-actions">
        <button type="submit" class="btn-primary">Cập nhật sản phẩm</button>
        <button type="button" onclick="history.back()" class="btn-secondary">Hủy</button>
      </div>

    </form>

  </main>
</div>

<script src="../assets/js/edit_product.js"></script>
</body>
</html>
