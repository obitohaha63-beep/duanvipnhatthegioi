<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thêm sản phẩm</title>

  <link rel="stylesheet" href="../assets/css/root.css">
  <link rel="stylesheet" href="../assets/css/QuanLySanPham.css">
</head>

<body>
<div class="container">

  <!-- SIDEBAR -->
  <nav class="sidebar">
    <h2 class="logo">Admin Panel</h2>

    <ul class="menu">
      <li><a href="dashboard.html">Dashboard</a></li>
      <li><a href="QuanLyuser.html">Quản lý người dùng / Quản trị viên</a></li>
      <li><a href="QuanLySanPham.html" style="background:#2a2a3b; color:#00bfff; border-left:4px solid #00bfff;">Quản lý sản phẩm</a></li>
      <li><a href="NhaphangGiaban.html">Nhập hàng</a></li>
      <li><a href="NhaphangGiaban2.html">Giá bán</a></li>
      <li><a href="DonhangTonkho.html">Đơn hàng & Tồn kho</a></li>
    </ul>
  </nav>

  <!-- CONTENT -->
  <main class="content">

    <!-- HEADER -->
    <div class="page-header">
      <h1>Thêm sản phẩm</h1>
      <button onclick="history.back()" class="btn-secondary">← Quay lại</button>
    </div>

    <form id="addProductForm" class="form-card">

      <!-- GRID -->
      <div class="form-grid">

        <!-- LEFT -->
        <div class="form-group">
          <label>Danh mục</label>
          <select name="category_id" id="categorySelect" required></select>

          <label>Thương hiệu</label>
          <select name="brand_id" id="brandSelect" required></select>

          <label>Tên sản phẩm</label>
          <input type="text" name="name" placeholder="VD: Vợt cầu lông Yonex..." required>

          <label>Giá nhập</label>
          <input type="number" name="cost_price" placeholder="VD: 500000" required>

          <label>% Lợi nhuận</label>
          <input type="number" name="profit_percent" placeholder="VD: 20">

          <div class="price-preview">
            Giá bán dự kiến: <span id="previewPrice">0đ</span>
          </div>

          <label>Số lượng</label>
          <input type="number" name="quantity" value="0">
        </div>

        <!-- RIGHT -->
        <div class="form-group">
          <label>Ảnh sản phẩm</label>
          <input type="file" id="imageInput" accept="image/*">

          <img id="previewImage" class="preview-img" src="" alt="Preview">

          <label>Mô tả</label>
          <textarea name="description" rows="5"></textarea>

          <label>Trạng thái</label>
          <select name="status">
            <option value="active">Hiển thị</option>
            <option value="hidden">Ẩn</option>
          </select>
        </div>

      </div>

      <!-- ATTRIBUTES -->
      <div class="card">
        <h3>Thuộc tính sản phẩm</h3>
        <div id="dynamicAttributes"></div>
      </div>

      <!-- ACTION -->
      <div class="form-actions">
        <button type="submit" class="btn-primary">+ Thêm sản phẩm</button>
        <button type="button" onclick="history.back()" class="btn-secondary">Hủy</button>
      </div>

    </form>

  </main>
</div>

<script src="../assets/js/add_product.js"></script>

<script>
const costInput = document.querySelector('[name="cost_price"]');
const profitInput = document.querySelector('[name="profit_percent"]');
const preview = document.getElementById('previewPrice');

function updatePrice() {
  const cost = parseFloat(costInput.value) || 0;
  const profit = parseFloat(profitInput.value) || 0;
  const price = cost * (1 + profit / 100);
  preview.innerText = price.toLocaleString('vi-VN') + "đ";
}

costInput.addEventListener('input', updatePrice);
profitInput.addEventListener('input', updatePrice);

document.getElementById('imageInput').addEventListener('change', function(e){
  const file = e.target.files[0];
  if(file){
    const url = URL.createObjectURL(file);
    document.getElementById('previewImage').src = url;
  }
});



</script>

</body>
</html>
