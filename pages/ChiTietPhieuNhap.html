      </ul>
    </nav>

    <main class="content">
      <div class="sub-container">
        <section class="sub-section">

          <h2>Quản lý nhập hàng</h2>
          <p class="desc">Chi tiết phiếu nhập</p>

          <div class="receipt-card">

            <!-- THÔNG TIN PHIẾU -->
            <div class="receipt-box">

              <div class="receipt-row">
                <div class="receipt-field">
                  <label>Mã phiếu nhập</label>
                  <input type="text" id="order-id" readonly>
                </div>
              </div>

              <div class="receipt-row">
                <div class="receipt-field">
                  <label>Ngày nhập</label>
                  <input id="order-date" type="datetime-local" readonly>
                </div>
              </div>

              <div class="receipt-row">
                <div class="receipt-field">
                  <label>Tổng giá nhập</label>
                  <input type="text" id="total-amount" readonly>
                </div>
              </div>

              <div class="receipt-buttons">
                <button class="btn-delete1" id="edit-btn">Sửa phiếu</button>
                <button class="btn-confirm" id="confirm-btn">Hoàn tất</button>
              </div>

            </div>

            <!-- BẢNG SẢN PHẨM -->
            <table class="data-table">
              <thead>
                <tr>
                  <th>Tên sản phẩm</th>
                  <th>Số lượng nhập</th>
                  <th>Giá nhập</th>
                  <th>Số lần nhập</th>
                  <th>Thành tiền</th>
                </tr>
              </thead>

              <tbody id="product-table-body">
                <!-- JS render sản phẩm -->
              </tbody>

            </table>

          </div>

        </section>
      </div>
    </main>

  </div>

  <script src="../assets/js/chitietphieunhap.js"></script>
