<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quản lý sản phẩm</title>

  <link rel="stylesheet" href="../assets/css/root.css">
  <link rel="stylesheet" href="../assets/css/QuanLySanPham.css">
</head>

<body>
<div class="container">

  <!-- SIDEBAR -->
  <nav class="sidebar">
    <h2 class="logo">Admin</h2>

    <ul class="menu">
      <li><a href="dashboard.html">Dashboard</a></li>
      <li><a href="QuanLyuser.html">Quản lý người dùng / Quản trị viên</a></li>
      <li><a href="QuanLySanPham.html" style="background:#2a2a3b; color:#00bfff; border-left:4px solid #00bfff;">Quản lý sản phẩm</a></li>
      <li><a href="NhaphangGiaban.html">Nhập hàng</a></li>
      <li><a href="NhaphangGiaban2.html">Giá bán</a></li>
      <li><a href="DonhangTonkho.html">Đơn hàng & Tồn kho</a></li>
    </ul>
  </nav>

  <!-- CONTENT -->
  <main class="content">

    <!-- HEADER -->
    <div class="page-header">
      <h1>Quản lý sản phẩm</h1>
    </div>

    <!-- CATEGORY -->
    <section class="card">
      <div class="card-header">
        <h2>Danh mục</h2>
        <button onclick="location.href='ThemSanPham.html'" class="btn-primary">
          + Thêm loại
        </button>
      </div>

      <table>
        <thead>
          <tr>
            <th>ID</th>
            <th>Tên</th>
            <th>Mô tả</th>
            <th>Ngày tạo</th>
            <th>Hành động</th>
          </tr>
        </thead>
        <tbody id="categoryTable"></tbody>
      </table>
    </section>

    <!-- PRODUCT -->
    <section class="card">
      <div class="card-header">
        <h2>Danh sách sản phẩm</h2>
        <button onclick="location.href='AddProduct.html'" class="btn-primary">
          + Thêm sản phẩm
        </button>
      </div>

      <table>
        <thead>
          <tr>
            <th>ID</th>
            <th>Ảnh</th>
            <th>Tên sản phẩm</th>
            <th>Danh mục</th>
            <th>Giá nhập</th>
            <th>% Lợi nhuận</th>
            <th>Giá bán</th>
            <th>Trạng thái</th>
            <th>Hành động</th>
          </tr>
        </thead>

        <tbody id="productTable"></tbody>
      </table>
    </section>

  </main>
</div>

<script src="../assets/js/category.js"></script>
<script src="../assets/js/product.js"></script>
</body>
</html>
