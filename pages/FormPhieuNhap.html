<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trang Quản Trị</title>
  <link rel="stylesheet" href="../assets/css/NhaphangGiaban.css">
  <link rel="stylesheet" href="../assets/css/fontinter.css">
  <link rel="stylesheet" href="../assets/css/root.css">
</head>
<body>
  <div class="container">
    <nav class="sidebar">
      <h2 class="logo">Admin</h2>
      <ul class="menu">
        <li><a href="dashboard.html">Dashboard</a></li>
        <li><a href="QuanLyuser.html">Quản lý người dùng / Quản trị viên</a></li>
        <li><a href="QuanLySanPham.html">Quản lý sản phẩm</a></li>
        <li><a href="NhaphangGiaban.html" style="background:#2a2a3b; color:#00bfff; border-left:4px solid #00bfff;">Quản lý nhập hàng</a></li>
        <li><a href="NhaphangGiaban2.html">Quản lý giá bán</a></li>
        <li><a href="QuanLyDonHang.html">Quản lý đơn đặt hàng</a></li>
        <li><a href="QuanLyTonKho.html">Quản lý tồn kho</a></li>
      </ul>
    </nav>

    <main class="content">
      <div class="form-container">
        <h3>Tạo phiếu nhập hàng</h3>
        <form id="form-phieunhap">

          <div class="form-row">
            <label for="ngay-nhap">Ngày nhập</label>
            <input type="datetime-local" id="ngay-nhap" required>
          </div>

          <div class="form-row">
            <label for="so-san-pham">Số sản phẩm muốn thêm</label>
            <input type="number" id="so-san-pham" min="1" placeholder="Nhập số sản phẩm">
          </div>

          <div id="product-list"></div>

          <div class="form-buttons">
            <button type="button" id="btn-complete" class="btn btn-save">Hoàn thành phiếu nhập</button>
            <button type="button" class="btn btn-cancel" onclick="location.href='NhapHangGiaBan.html'">Hủy</button>
          </div>

        </form>
      </div>
    </main>
  </div>

  <script src="../assets/js/addphieunhap.js"></script>
</body>
</html>
