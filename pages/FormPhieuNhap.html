<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trang Quản Trị</title>
  <link rel="stylesheet" href="../assets/css/NhaphangGiaban.css">
  <link rel="stylesheet" href="../assets/css/fontinter.css">
  <link rel="stylesheet" href="../assets/css/root.css">
</head>
<body>
  <div class="container">
    <!-- Menu bên trái -->
    <nav class="sidebar">
      <h2 class="logo">Admin</h2>
      <ul class="menu">
        <li><a href="dashboard.html"> Dashboard</a></li>
        
        <li><a href="QuanLyuser.html"> Quản lý người dùng / Khách hàng</a></li>

        <li><a href="QuanLySanPham.html"> Quản lý sản phẩm</a></li>


        <li><a href="NhaphangGiaban.html"
          style="background:#2a2a3b; color:#00bfff; 
          border-left:4px solid #00bfff;"> Nhập hàng</a></li>
        <li><a href="NhaphangGiaban2.html"> Giá bán</a></li>

        <li><a href="DonhangTonkho.html"> Đơn hàng & Tồn kho</a></li>
      </ul>
    </nav>

    <main class="content">
                <!-- FORM thêm / sửa sản phẩm -->
        <div class="form-container">
          <h3>Tạo phiếu nhập hàng</h3>

          <form class="form-giaban">

            <!-- Dòng 1 -->
            <div class="form-row">
              <label for="ngay-nhap">Ngày nhập</label>
              <input type="datetime-local" id="ngay-nhap" required>
            </div>

            <!-- Dòng 2 -->
            <div class="form-row">
              <label for="so-san-pham">Số sản phẩm muốn thêm</label>
              <input type="number" id="so-san-pham" min="1" placeholder="Nhập số sản phẩm">
            </div>

            <!-- Nơi sinh bảng -->
            <div id="product-list"></div>

            <!-- Dòng cuối -->
            <div class="form-row">
              <label for="trang-thai">Trạng thái phiếu nhập</label>
              <select id="trang-thai" required>
                <option value="">-- Chọn trạng thái --</option>
                <option value="cho-xu-ly">Chờ xử lí</option>
                <option value="hoan-thanh">Hoàn thành</option>
                <option value="da-huy">Đã hủy</option>
              </select>
            </div>

            <div class="form-buttons">
              <button type="submit" class="btn btn-save">Hoàn Thành</button>
              <button type="button" class="btn btn-cancel" onclick="location.href='NhapHangGiaBan.html'">Hủy</button>
            </div>

          </form>
        </div>

    </main>   
  </div>  
<script src="../assets/js/addphieunhap.js"></script> 
</body>
</html>
