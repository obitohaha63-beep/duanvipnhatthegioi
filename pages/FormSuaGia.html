<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trang Quản Trị</title>
  <link rel="stylesheet" href="../assets/css/NhaphangGiaban.css">
  <link rel="stylesheet" href="../assets/css/fontinter.css">
  <link rel="stylesheet" href="../assets/css/root.css">
</head>
<body>
  <div class="container">
    <!-- Menu bên trái -->
    <nav class="sidebar">
      <h2 class="logo">Admin</h2>
      <ul class="menu">
        <li><a href="dashboard.html">Dashboard</a></li>
        <li><a href="QuanLyuser.html">Quản lý người dùng / Quản trị viên</a></li>
        <li><a href="QuanLySanPham.html">Quản lý sản phẩm</a></li>
        <li><a href="NhaphangGiaban.html">Quản lý nhập hàng</a></li>
        <li>
          <a href="NhaphangGiaban2.html"
            style="background:#2a2a3b; color:#00bfff; border-left:4px solid #00bfff;">
            Quản lý giá bán
          </a>
        </li>
        <li><a href="QuanLyDonHang.html">Quản lý đơn đặt hàng</a></li>
        <li><a href="QuanLyTonKho.html">Quản lý tồn kho</a></li>
      </ul>
    </nav>

    <main class="content">
      <div class="form-container">
        <h3>Sửa giá bán theo % lợi nhuận</h3>

        <form class="form-giaban" data-id="">
          
          <!-- Danh mục sản phẩm -->
          <div class="form-row">
            <label for="ten-san-pham">Tên sản phẩm</label>
            <input type="text" id="ten-san-pham" readonly>
          </div>

          <!-- Số lượng hiện tại -->
          <div class="form-row">
            <label for="so-luong-hien-tai">Số lượng hiện tại</label>
            <input type="number" id="so-luong-hien-tai" placeholder="0" readonly>
          </div>

          <!-- Giá vốn hiện tại -->
          <div class="form-row">
            <label for="gia-von-hien-tai">Giá vốn hiện tại (VNĐ)</label>
            <input type="number" id="gia-von-hien-tai" placeholder="0" readonly>
          </div>

          <!-- Giá bán hiện tại -->
          <div class="form-row">
            <label for="gia-ban-hien-tai">Giá bán hiện tại (VNĐ)</label>
            <input type="number" id="gia-ban-hien-tai" placeholder="0" readonly>
          </div>

          <!-- % Lợi nhuận hiện tại -->
          <div class="form-row">
            <label for="loi-nhuan-hien-tai">% Lợi nhuận hiện tại</label>
            <input type="number" id="loi-nhuan-hien-tai" placeholder="0" readonly>
          </div>

          <!-- % Lợi nhuận mới -->
          <div class="form-row">
            <label for="loinhuan-moi">% Lợi nhuận muốn sửa</label>
            <input type="number" id="loinhuan-moi" placeholder="Nhập % lợi nhuận mới" required>
          </div>

          <div class="form-buttons">
            <button type="submit" class="btn btn-save">Hoàn Thành</button>
            <button type="button" class="btn btn-cancel" onclick="location.href='NhaphangGiaban2.html'">Hủy</button>
          </div>
        </form>
      </div>
    </main>
  </div>

  <!-- File JS riêng cho form -->
  <script src="../assets/js/sua_gia.js"></script>
</body>
</html>
