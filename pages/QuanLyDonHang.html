<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Quản lý đơn đặt hàng</title>
  <link rel="stylesheet" href="../assets/css/DonhangTonkho.css">
</head>
<body>
<div class="container">

  <!-- Sidebar -->
  <nav class="sidebar">
    <h2 class="logo">Admin</h2>

    <ul class="menu">
      <li><a href="dashboard.html">Dashboard</a></li>
      <li><a href="QuanLyuser.html">Quản lý người dùng / Quản trị viên</a></li>
      <li><a href="QuanLySanPham.html">Quản lý sản phẩm</a></li>
      <li><a href="NhaphangGiaban.html">Quản lý nhập hàng</a></li>
      <li><a href="NhaphangGiaban2.html">Quản lý giá bán</a></li>
      <li><a href="QuanLyDonHang.html"
        style="background:#2a2a3b; color:#00bfff; border-left:4px solid #00bfff;">
        Quản lý đơn đặt hàng
      </a></li>
      <li><a href="QuanLyTonKho.html">Quản lý tồn kho</a></li>
    </ul>
  </nav>

  <!-- Nội dung -->
  <main class="content">
    <div class="card">
      <h2>Quản lý đơn đặt hàng</h2>

      <div class="form-group">
        <label>Từ ngày:</label>
        <input type="date" id="fromDate">

        <label>Đến ngày:</label>
        <input type="date" id="toDate">

        <label>Tình trạng:</label>
        <select id="statusFilter">
          <option value="">Tất cả</option>
          <option value="pending">Chưa xử lý</option>
          <option value="confirmed">Xác nhận</option>
          <option value="delivered">Đã giao thành công</option>
          <option value="cancelled">Hủy đơn hàng</option>
        </select>

        <button id="searchBtn">Tra cứu</button>
      </div>

      <table>
        <thead>
          <tr>
            <th>Mã đơn</th>
            <th>Khách hàng</th>
            <th>Ngày đặt</th>
            <th>Tổng tiền</th>
            <th>Tình trạng</th>
            <th>Chi tiết</th>
          </tr>
        </thead>
        <tbody id="orderTableBody">
        </tbody>
      </table>

    </div>
  </main>

</div>

<script src="../assets/js/QuanLyDonHang.js"></script>
</body>
</html>
